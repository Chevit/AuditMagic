repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.14
        # Migrations are historical records; reformatting them churns blame
        exclude: ^alembic/versions/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        exclude: ^alembic/versions/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # Settings live in .flake8 — inline args here would override the file
        # rather than add to it, so the hook and a local run would diverge.
        # The exclude must be repeated here: flake8's own exclude does not
        # filter paths handed to it explicitly, which is how pre-commit calls it.
        exclude: ^alembic/versions/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        # mypy resolves modules across the whole package, so it runs on src as
        # a whole rather than on the changed files pre-commit would pass in.
        args: ["src"]
        pass_filenames: false
        require_serial: true
        files: ^src/
        # Needed for real types rather than Any: SQLAlchemy ships py.typed and
        # PyQt6 ships stubs. Keep pinned to requirements-dev.txt.
        additional_dependencies:
          - SQLAlchemy==2.0.49
          - PyQt6==6.11.0
          # Without it, `from alembic import command` in db.py resolves to the
          # repo's own alembic/ directory instead of the package.
          - alembic==1.18.4

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
